services:
  hydradb:
    # Agent memory layer: object-store-native graph DB, OpenCypher over Bolt + HTTP.
    # Self-hosted so trade history and agent memory never leave this machine.
    # Off for now: only starts with `--profile memory`. To turn it back on:
    #   MEMORY_ENABLED=true docker compose --profile memory up -d
    image: ghcr.io/hydra-db/hydradb:latest
    profiles: ["memory"]
    container_name: tradeflow-hydradb
    user: "1000:1000"
    ports:
      - "7687:7687"   # Bolt (neo4j-driver compatible)
      - "8443:8443"   # HTTP query API
      - "9090:9090"   # readiness + Prometheus metrics
    volumes:
      - ./hydradb-data:/data
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=0.0.0.0:7687
      GRAPH_ADVERTISED_BOLT_ADDR: hydradb:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    restart: unless-stopped
    networks:
      - tradeflow-net

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: tradeflow-backend
    env_file:
      - ./api/.env
    # Host networking: the trade desk's LLM (Ollama) runs on the host and listens
    # on 127.0.0.1:11434 only, which a bridged container cannot reach. On the
    # host network the container's localhost is the host's, and the API is on
    # port 8000 of the host directly (no port mapping needed).
    network_mode: host
    environment:
      MEMORY_ENABLED: "${MEMORY_ENABLED:-false}"
      # Log timestamps and labels in the operator's time; trading logic uses New York time.
      TZ: "${DISPLAY_TIMEZONE:-Europe/Paris}"
      DISPLAY_TIMEZONE: "${DISPLAY_TIMEZONE:-Europe/Paris}"
      OLLAMA_URL: http://localhost:11434
      HYDRA_HTTP_URL: http://localhost:8443
      HYDRA_GRAPH_ID: default
      HYDRA_NAMESPACE: default
      HYDRA_CELL_ID: cell-0
      HYDRA_AUTH_TOKEN_FILE: /hydra/auth-token
    volumes:
      - ./api:/app
      - hf-cache:/root/.cache/huggingface
      # read-only: the backend needs the token, not write access to the graph store
      - ./hydradb-data/auth-token:/hydra/auth-token:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: tradeflow-frontend
    ports:
      - "5173:5173"
    # The backend runs on the host network (see backend); nginx reaches it
    # through the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - tradeflow-net

volumes:
  hf-cache:

networks:
  tradeflow-net:
    driver: bridge
